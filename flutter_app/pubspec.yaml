name: viona
description: VIONA — Daily Lottery Platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP & networking
  dio: ^5.4.3
  web_socket_channel: ^2.4.4

  # Secure storage (JWT token)
  flutter_secure_storage: ^9.0.0

  # Fonts — loaded via google_fonts package (no bundled ttf needed)
  google_fonts: ^6.2.1

  # Images
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
